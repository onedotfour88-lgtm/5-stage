<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 자료실</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#164b8e"><link rel="icon" href="/icons/app-192.png">
  <style>
    body {
      font-family: system-ui, sans-serif; color: #162b43; background: #f4f7fc;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    .card {
      border: 1px solid #d8e2ee; background: white; box-shadow: 0 4px 18px #1234560a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .hidden { display: none; }
    input, textarea, button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #164b8e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0051a2; }
    .error { color: red; }
  </style>
</head>
<body data-auth-url="https://igumgbitelfytidliydi.supabase.co" data-publishable-key="sb_publishable_8J_Z3OYMltWvyo5GbHOr_w_7SKxVPTE">
  <h1>🔒 나만의 자료실</h1>

  <p>앱 설치와 기기 승인은 별개입니다. 서버의 승인 확인 후에만 자료를 엽니다.</p>
  <p>오프라인에서는 보호 자료를 저장하거나 표시하지 않습니다.</p>
  <button id="install-btn" class="hidden">홈 화면에 설치</button>
  <div id="device-section" class="card hidden">
    <h2>기기 승인</h2><p id="device-status" role="status" aria-live="polite">승인 확인 필요</p>
    <button id="request-device-btn">기기 승인 요청</button>
    <button id="refresh-device-btn">승인 결과 확인</button>
    <button id="logout-btn">로그아웃</button>
  </div>
  <!-- 로그인 / 회원가입 섹션 -->
  <div id="auth-section" class="card">
    <h2>로그인 / 회원가입</h2>
    <div id="auth-error" class="error"></div>
    <label for="email">이메일</label>
    <input type="email" id="email" placeholder="이메일 입력">
    <label for="password">비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호 입력">
    <button id="login-btn">로그인</button>
    <button id="signup-btn" style="background-color: #4CAF50;">회원가입</button>
  </div>

  <!-- 메모 목록 및 작성 섹션 (로그인 후 표시) -->
  <div id="memo-section" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>내 메모 목록</h2>
    </div>
    <div id="memo-error" class="error"></div>
    <ul id="memo-list"></ul>

    <h3>새 메모 작성</h3>
    <label for="memo-title">제목</label>
    <input type="text" id="memo-title" placeholder="제목">
    <label for="memo-body">내용</label>
    <textarea id="memo-body" placeholder="내용"></textarea>
    <button id="save-memo-btn">저장하기</button>
  </div>

  <script type="module" src="/app.mjs"></script>
</body>
</html>
