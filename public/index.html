<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자료실 (5단계)</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .hidden { display: none; }
    input, textarea, button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0051a2; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🔒 자료실 (5단계)</h1>

  <!-- 로그인 / 회원가입 섹션 -->
  <div id="auth-section" class="card">
    <h2>로그인 / 회원가입</h2>
    <div id="auth-error" class="error"></div>
    <label>이메일</label>
    <input type="email" id="email" placeholder="user@example.com">
    <label>비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호 입력">
    <button id="login-btn">로그인</button>
    <button id="signup-btn" style="background-color: #4CAF50;">회원가입</button>
  </div>

  <!-- 메모 목록 및 작성 섹션 (로그인 후 표시) -->
  <div id="memo-section" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>내 메모 목록</h2>
      <button id="logout-btn" style="width: auto; padding: 6px 12px; background-color: #888;">로그아웃</button>
    </div>
    <div id="memo-error" class="error"></div>
    <ul id="memo-list"></ul>

    <h3>새 메모 작성</h3>
    <label>제목</label>
    <input type="text" id="memo-title" placeholder="제목">
    <label>내용</label>
    <textarea id="memo-body" placeholder="내용"></textarea>
    <button id="save-memo-btn">저장하기</button>
  </div>

  <script type="module">
    const authSection = document.getElementById('auth-section');
    const memoSection = document.getElementById('memo-section');
    const authError = document.getElementById('auth-error');
    const memoError = document.getElementById('memo-error');
    const memoList = document.getElementById('memo-list');

    let currentToken = localStorage.getItem('access_token') || null;

    function checkSession() {
      if (currentToken) {
        showMemoSection();
      } else {
        showAuthSection();
      }
    }

    function showAuthSection() {
      authSection.classList.remove('hidden');
      memoSection.classList.add('hidden');
    }

    function showMemoSection() {
      authSection.classList.add('hidden');
      memoSection.classList.remove('hidden');
      loadMemos();
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      authError.textContent = '';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/memos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          authError.textContent = '로그인 실패: ' + (data.message || '인증 오류');
          return;
        }
        if (data.token || data.access_token) {
          currentToken = data.token || data.access_token;
          localStorage.setItem('access_token', currentToken);
          showMemoSection();
        } else {
          showMemoSection();
        }
      } catch (err) {
        authError.textContent = '로그인 요청 중 오류가 발생했습니다.';
      }
    });

    document.getElementById('signup-btn').addEventListener('click', async () => {
      authError.textContent = '';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/memos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'signup', email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          authError.textContent = '회원가입 실패: ' + (data.message || '오류 발생');
        } else {
          alert('회원가입 성공! 로그인해 주세요.');
        }
      } catch (err) {
        authError.textContent = '회원가입 요청 중 오류가 발생했습니다.';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      currentToken = null;
      localStorage.removeItem('access_token');
      showAuthSection();
    });

    async function loadMemos() {
      memoError.textContent = '';
      try {
        const headers = {};
        if (currentToken) {
          headers['Authorization'] = `Bearer ${currentToken}`;
        }
        const res = await fetch('/api/memos', { headers });
        if (!res.ok) {
          const errData = await res.json();
          memoError.textContent = '오류: ' + (errData.message || '자료를 불러오지 못했습니다.');
          return;
        }
        const data = await res.json();
        memoList.innerHTML = '';
        if (Array.isArray(data)) {
          data.forEach(memo => {
            const li = document.createElement('li');
            li.textContent = `${memo.title || '제목 없음'}: ${memo.body || ''}`;
            memoList.appendChild(li);
          });
        }
      } catch (err) {
        memoError.textContent = '통신 오류가 발생했습니다.';
      }
    }

    document.getElementById('save-memo-btn').addEventListener('click', async () => {
      const title = document.getElementById('memo-title').value;
      const body = document.getElementById('memo-body').value;

      const headers = { 'Content-Type': 'application/json' };
      if (currentToken) {
        headers['Authorization'] = `Bearer ${currentToken}`;
      }

      const res = await fetch('/api/memos', {
        method: 'POST',
        headers,
        body: JSON.stringify({ title, body })
      });

      if (res.ok) {
        document.getElementById('memo-title').value = '';
        document.getElementById('memo-body').value = '';
        loadMemos();
      } else {
        alert('저장 실패');
      }
    });

    checkSession();
  </script>
</body>
</html>
